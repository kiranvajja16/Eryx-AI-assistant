<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERYX AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>ERYX</h1>

    <p>Real-Time AI Voice Assistant</p>

    <button id="micButton">
         Start Recording
    </button>

    <p id="status">Disconnected</p>

    <script>

        let socket;
        let mediaRecorder;

        const button = document.getElementById("micButton");
        const status = document.getElementById("status");


        // Connect to FastAPI WebSocket
        function connectWebSocket() {

            socket = new WebSocket(
                "ws://127.0.0.1:8000/ws"
            );

            socket.onopen = function () {

                status.textContent =
                    "Connected to ERYX";

                console.log(
                    "Connected to ERYX"
                );
            };


            socket.onmessage = function(event) {

                console.log(
                    "ERYX:",
                    event.data
                );

                status.textContent =
                    event.data;
            };


            socket.onclose = function() {

                status.textContent =
                    "Disconnected";
            };
        }


        // Start microphone
        async function startRecording() {

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    });


            mediaRecorder =
                new MediaRecorder(stream);


            mediaRecorder.ondataavailable =
                function(event) {

                    if (
                        event.data.size > 0 &&
                        socket.readyState === WebSocket.OPEN
                    ) {

                        socket.send(event.data);
                    }
                };

            //break audio into chuncks
            mediaRecorder.start(500);

            status.textContent =
                " ERYX is listening...";

            button.textContent =
                " Stop Recording";
        }


        function stopRecording() {

            if (mediaRecorder) {

                if (socket.readyState === WebSocket.OPEN) {
                    socket.send("STOP");
                }

                mediaRecorder.stop();

                mediaRecorder.stream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );
            }

            status.textContent =
                "Recording stopped";

            button.textContent =
                " Start Recording";
        }


        button.addEventListener(
            "click",
            function() {

                if (
                    !mediaRecorder ||
                    mediaRecorder.state === "inactive"
                ) {

                    startRecording();

                } else {

                    stopRecording();

                }

            }
        );


        // Start WebSocket connection
        connectWebSocket();

    </script>

</body>
</html>
