<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ERYX AI Assistant</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        button {
            margin-top: 30px;
            padding: 18px 35px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 25px;
            font-weight: bold;
        }

        #latency {
            margin-top: 15px;
            font-weight: bold;
        }

        .box {
            width: 80%;
            max-width: 800px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            text-align: left;
        }

        .label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        #transcript,
        #answer {
            min-height: 30px;
        }

    </style>

</head>


<body>

    <h1>ERYX</h1>

    <p>
        Real-Time AI Voice Assistant
    </p>


    <button id="micButton">
        🎤 Activate ERYX
    </button>


    <p id="status">
        🔴 Connecting...
    </p>


    <p id="latency">
        ⚡ Response latency: -
    </p>


    <div class="box">

        <div class="label">
            You:
        </div>

        <div id="transcript">
            -
        </div>

    </div>


    <div class="box">

        <div class="label">
            ERYX:
        </div>

        <div id="answer">
            -
        </div>

    </div>


<script>


// ======================================================
// GLOBAL VARIABLES
// ======================================================

let socket = null;

let audioContext = null;

let microphoneStream = null;

let microphoneSource = null;

let pcmProcessor = null;

let recording = false;


// ======================================================
// PLAYBACK
// ======================================================

let playbackContext = null;

let nextPlayTime = 0;


// ======================================================
// WAKE WORD
// ======================================================

let recognition = null;

let wakeWordActive = false;

let recognitionStarting = false;


// ======================================================
// LATENCY
// ======================================================

// Time when user ends the turn.

let turnEndTime = null;


// Prevent measuring multiple audio chunks.

let firstAudioReceived = false;


// ======================================================
// DOM ELEMENTS
// ======================================================

const button =
    document.getElementById("micButton");

const status =
    document.getElementById("status");

const transcript =
    document.getElementById("transcript");

const answer =
    document.getElementById("answer");

const latency =
    document.getElementById("latency");


// ======================================================
// WAKE WORD SETUP
// ======================================================

function setupWakeWord() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        console.warn(
            "SpeechRecognition is not supported."
        );

        status.textContent =
            "⚠️ Wake word unavailable — use button";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function () {

            recognitionStarting =
                false;

            wakeWordActive =
                true;


            if (!recording) {

                status.textContent =
                    '🎧 Say "Hey ERYX"';

            }


            console.log(
                "Wake-word listener started"
            );

        };


    recognition.onresult =
        function (event) {

            let text = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                text +=
                    event.results[i][0].transcript;

            }


            text =
                text.toLowerCase()
                    .trim();


            console.log(
                "Wake listener:",
                text
            );


            const wakeWords = [
                "hey eryx",
                "hey erix",
                "hey erics",
                "hi eryx",
                "hello eryx"
            ];


            const detected =
                wakeWords.some(
                    word =>
                        text.includes(word)
                );


            if (detected) {

                console.log(
                    "🔥 WAKE WORD DETECTED"
                );


                activateERYX();

            }

        };


    recognition.onerror =
        function (event) {

            recognitionStarting =
                false;

            console.warn(
                "Wake recognition error:",
                event.error
            );

        };


    recognition.onend =
        function () {

            recognitionStarting =
                false;


            if (
                wakeWordActive &&
                !recording
            ) {

                setTimeout(
                    startWakeWord,
                    500
                );

            }

        };

}


// ======================================================
// START WAKE WORD
// ======================================================

function startWakeWord() {

    if (!recognition) {
        return;
    }


    if (recognitionStarting) {
        return;
    }


    if (recording) {
        return;
    }


    if (!wakeWordActive) {

        wakeWordActive =
            true;

    }


    recognitionStarting =
        true;


    try {

        recognition.start();

    }

    catch (error) {

        recognitionStarting =
            false;

        console.log(
            "Wake listener already active"
        );

    }

}


// ======================================================
// STOP WAKE WORD
// ======================================================

function stopWakeWord() {

    if (!recognition) {
        return;
    }


    wakeWordActive =
        false;


    recognitionStarting =
        false;


    try {

        recognition.stop();

    }

    catch (error) {

        console.log(
            "Wake recognition stop error:",
            error
        );

    }

}


// ======================================================
// ACTIVATE ERYX
// ======================================================

async function activateERYX() {

    console.log(
        "🚀 Activating ERYX"
    );


    stopWakeWord();


    status.textContent =
        "🎤 ERYX activated — speak now";


    await startRecording();

}


// ======================================================
// WEBSOCKET CONNECTION
// ======================================================

function connectWebSocket() {

    const protocol =
        window.location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket = new WebSocket(
        `${protocol}//${window.location.host}/ws`
    );


    socket.binaryType =
        "arraybuffer";


    socket.onopen =
        function () {

            console.log(
                "Connected to ERYX"
            );


            status.textContent =
                '🟢 Connected — say "Hey ERYX"';


            startWakeWord();

        };


    socket.onclose =
        function () {

            console.log(
                "Disconnected from ERYX"
            );


            status.textContent =
                "🔴 ERYX Disconnected";

        };


    socket.onerror =
        function (error) {

            console.error(
                "WebSocket error:",
                error
            );


            status.textContent =
                "❌ Connection error";

        };


    // ==================================================
    // RECEIVE FROM SERVER
    // ==================================================

    socket.onmessage =
        async function (event) {


            // ==========================================
            // ERYX AUDIO
            // ==========================================

            if (
                event.data instanceof ArrayBuffer
            ) {

                console.log(
                    "ERYX audio:",
                    event.data.byteLength,
                    "bytes"
                );


                // --------------------------------------
                // LATENCY MEASUREMENT
                // --------------------------------------

                if (
                    turnEndTime !== null &&
                    !firstAudioReceived
                ) {

                    firstAudioReceived =
                        true;


                    const responseTime =
                        performance.now() -
                        turnEndTime;


                    const seconds =
                        responseTime / 1000;


                    latency.textContent =
                        `⚡ Response latency: ${seconds.toFixed(2)} seconds`;


                    console.log(
                        "================================"
                    );


                    console.log(
                        "⚡ RESPONSE LATENCY:",
                        responseTime.toFixed(0),
                        "ms"
                    );


                    console.log(
                        "================================"
                    );

                }


                await playPCM(
                    event.data
                );


                status.textContent =
                    "🔊 ERYX is speaking...";


                return;

            }


            // ==========================================
            // TEXT MESSAGE
            // ==========================================

            let message;


            try {

                message =
                    JSON.parse(event.data);

            }

            catch (error) {

                console.warn(
                    "Invalid server message:",
                    event.data
                );

                return;

            }


            console.log(
                "ERYX message:",
                message
            );


            // ==========================================
            // USER TRANSCRIPT
            // ==========================================

            if (
                message.type ===
                "transcript"
            ) {

                transcript.textContent =
                    message.text;


                status.textContent =
                    "🧠 ERYX is thinking...";

            }


            // ==========================================
            // ERYX TRANSCRIPT
            // ==========================================

            else if (
                message.type ===
                "answer"
            ) {

                answer.textContent +=
                    message.text;

            }


            // ==========================================
            // TURN COMPLETE
            // ==========================================

            else if (
                message.type ===
                "turn_complete"
            ) {

                console.log(
                    "ERYX: Turn complete"
                );


                recording =
                    false;


                status.textContent =
                    '🟢 Say "Hey ERYX" again';


                // Clear timer for next turn.

                turnEndTime =
                    null;


                firstAudioReceived =
                    false;


                startWakeWord();

            }

        };

}


// ======================================================
// START RECORDING
// ======================================================

async function startRecording() {

    try {

        if (
            !socket ||
            socket.readyState !==
            WebSocket.OPEN
        ) {

            console.log(
                "WebSocket is not ready"
            );

            return;

        }


        // ----------------------------------------------
        // Create 16 kHz audio context
        // ----------------------------------------------

        audioContext =
            new AudioContext({
                sampleRate: 16000
            });


        await audioContext.resume();


        // ----------------------------------------------
        // Microphone
        // ----------------------------------------------

        microphoneStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });


        // ----------------------------------------------
        // Microphone source
        // ----------------------------------------------

        microphoneSource =
            audioContext
                .createMediaStreamSource(
                    microphoneStream
                );


        // ----------------------------------------------
        // PCM processor
        // ----------------------------------------------

        await audioContext
            .audioWorklet
            .addModule(
                "/pcm-processor.js"
            );


        pcmProcessor =
            new AudioWorkletNode(
                audioContext,
                "pcm-processor"
            );


        pcmProcessor.port.onmessage =
            function (event) {

                if (
                    !recording ||
                    !socket ||
                    socket.readyState !==
                    WebSocket.OPEN
                ) {

                    return;

                }


                const pcmData =
                    event.data;


                // Do not log every chunk.
                // Logging every chunk can hurt latency.

                socket.send(
                    pcmData
                );

            };


        // ----------------------------------------------
        // Connect audio graph
        // ----------------------------------------------

        microphoneSource.connect(
            pcmProcessor
        );


        pcmProcessor.connect(
            audioContext.destination
        );


        recording =
            true;


        // ----------------------------------------------
        // Reset latency state
        // ----------------------------------------------

        turnEndTime =
            null;


        firstAudioReceived =
            false;


        latency.textContent =
            "⚡ Waiting for response...";


        // ----------------------------------------------
        // UI
        // ----------------------------------------------

        button.textContent =
            "⏹ Stop ERYX";


        status.textContent =
            "🎤 ERYX is listening...";


        transcript.textContent =
            "-";


        answer.textContent =
            "";


        console.log(
            "🎤 Microphone started"
        );

    }

    catch (error) {

        console.error(
            "Microphone error:",
            error
        );


        status.textContent =
            "❌ Microphone error";


        recording =
            false;


        startWakeWord();

    }

}


// ======================================================
// STOP RECORDING
// ======================================================

function stopRecording() {

    if (!recording) {

        return;

    }


    recording =
        false;


    // ----------------------------------------------
    // START LATENCY TIMER
    // ----------------------------------------------

    // This timestamp is taken immediately before
    // telling Gemini that the user's turn has ended.

    turnEndTime =
        performance.now();


    firstAudioReceived =
        false;


    latency.textContent =
        "⚡ Measuring response latency...";


    // ----------------------------------------------
    // Tell Gemini to end the audio turn
    // ----------------------------------------------

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        console.log(
            "ERYX: Ending turn"
        );


        socket.send(
            "STOP"
        );

    }


    // ----------------------------------------------
    // Stop microphone tracks
    // ----------------------------------------------

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        microphoneStream =
            null;

    }


    // ----------------------------------------------
    // Disconnect microphone
    // ----------------------------------------------

    if (microphoneSource) {

        microphoneSource.disconnect();

        microphoneSource =
            null;

    }


    // ----------------------------------------------
    // Disconnect PCM processor
    // ----------------------------------------------

    if (pcmProcessor) {

        pcmProcessor.disconnect();

        pcmProcessor =
            null;

    }


    // ----------------------------------------------
    // Close recording audio context
    // ----------------------------------------------

    if (audioContext) {

        audioContext.close();

        audioContext =
            null;

    }


    button.textContent =
        "🎤 Activate ERYX";


    status.textContent =
        "⏳ Processing...";


    console.log(
        "🎤 Recording stopped"
    );

}


// ======================================================
// PLAY ERYX AUDIO
// ======================================================

async function playPCM(
    arrayBuffer
) {

    try {

        if (!playbackContext) {

            playbackContext =
                new AudioContext({
                    sampleRate: 24000
                });

        }


        await playbackContext.resume();


        // ----------------------------------------------
        // Convert Int16 → Float32
        // ----------------------------------------------

        const int16 =
            new Int16Array(
                arrayBuffer
            );


        const float32 =
            new Float32Array(
                int16.length
            );


        for (
            let i = 0;
            i < int16.length;
            i++
        ) {

            float32[i] =
                int16[i] / 32768;

        }


        // ----------------------------------------------
        // Create audio buffer
        // ----------------------------------------------

        const audioBuffer =
            playbackContext
                .createBuffer(
                    1,
                    float32.length,
                    24000
                );


        audioBuffer
            .getChannelData(0)
            .set(float32);


        // ----------------------------------------------
        // Create source
        // ----------------------------------------------

        const source =
            playbackContext
                .createBufferSource();


        source.buffer =
            audioBuffer;


        source.connect(
            playbackContext.destination
        );


        // ----------------------------------------------
        // Queue audio
        // ----------------------------------------------

        const currentTime =
            playbackContext.currentTime;


        if (
            nextPlayTime <
            currentTime
        ) {

            nextPlayTime =
                currentTime;

        }


        source.start(
            nextPlayTime
        );


        nextPlayTime +=
            audioBuffer.duration;


    }

    catch (error) {

        console.error(
            "Audio playback error:",
            error
        );

    }

}


// ======================================================
// BUTTON
// ======================================================

button.addEventListener(
    "click",
    function () {

        if (!recording) {

            activateERYX();

        }

        else {

            stopRecording();

        }

    }
);


// ======================================================
// INITIALIZATION
// ======================================================

setupWakeWord();

connectWebSocket();


</script>

</body>

</html>
