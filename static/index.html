<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ERYX AI Assistant</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            text-align: center;

            color: #111;

        }


        .container {

            max-width: 900px;

            margin: 50px auto;

            padding: 20px;

        }


        h1 {

            font-size: 52px;

            margin-bottom: 10px;

        }


        .subtitle {

            font-size: 20px;

            margin-bottom: 40px;

        }


        #micButton {

            padding: 20px 40px;

            font-size: 22px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            background: #eeeeee;

            transition: 0.2s;

        }


        #micButton:hover {

            transform: scale(1.03);

        }


        #micButton:disabled {

            cursor: not-allowed;

            opacity: 0.6;

        }


        #status {

            margin-top: 30px;

            font-size: 20px;

            font-weight: bold;

            min-height: 30px;

        }


        .box {

            width: 100%;

            margin: 30px auto;

            padding: 25px;

            background: white;

            border-radius: 15px;

            text-align: left;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);

        }


        .label {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        #transcript,
        #answer {

            font-size: 18px;

            line-height: 1.6;

            min-height: 35px;

            white-space: pre-wrap;

        }


    </style>

</head>


<body>


<div class="container">


    <h1>ERYX</h1>


    <div class="subtitle">
        Real-Time AI Voice Assistant
    </div>


    <button id="micButton">
        🎤 Start ERYX
    </button>


    <div id="status">
        🔵 Connecting...
    </div>


    <!-- USER -->

    <div class="box">

        <div class="label">
            You:
        </div>

        <div id="transcript">
            -
        </div>

    </div>


    <!-- ERYX -->

    <div class="box">

        <div class="label">
            ERYX:
        </div>

        <div id="answer">
            -
        </div>

    </div>


</div>


<script>


// =====================================================
// GLOBAL VARIABLES
// =====================================================

let socket = null;

let audioContext = null;

let microphoneStream = null;

let microphoneSource = null;

let pcmProcessor = null;

let recording = false;


// ERYX AUDIO PLAYBACK

let playbackContext = null;

let nextPlayTime = 0;


// =====================================================
// DOM ELEMENTS
// =====================================================

const button =
    document.getElementById("micButton");

const status =
    document.getElementById("status");

const transcript =
    document.getElementById("transcript");

const answer =
    document.getElementById("answer");


// =====================================================
// CONNECT TO FASTAPI
// =====================================================

function connectWebSocket() {

    socket = new WebSocket(
        "ws://127.0.0.1:8000/ws"
    );


    socket.binaryType = "arraybuffer";


    // -------------------------------------------------
    // CONNECTED
    // -------------------------------------------------

    socket.onopen = function () {

        console.log(
            "Connected to ERYX"
        );

        status.textContent =
            "🟢 ERYX Connected";

        button.disabled = false;

    };


    // -------------------------------------------------
    // DISCONNECTED
    // -------------------------------------------------

    socket.onclose = function () {

        console.log(
            "Disconnected from ERYX"
        );

        status.textContent =
            "🔴 ERYX Disconnected";

        button.disabled = true;

        recording = false;

    };


    // -------------------------------------------------
    // ERROR
    // -------------------------------------------------

    socket.onerror = function (error) {

        console.error(
            "WebSocket error:",
            error
        );

        status.textContent =
            "❌ Connection error";

    };


    // =================================================
    // RECEIVE DATA FROM ERYX
    // =================================================

    socket.onmessage = async function (event) {


        // =================================================
        // AUDIO DATA
        // =================================================

        if (event.data instanceof ArrayBuffer) {

            console.log(
                "Received ERYX audio:",
                event.data.byteLength,
                "bytes"
            );


            await playPCM(
                event.data
            );


            status.textContent =
                "🔊 ERYX is speaking...";


            return;

        }


        // =================================================
        // TEXT DATA
        // =================================================

        let message;


        try {

            message =
                JSON.parse(event.data);

        }

        catch (error) {

            console.error(
                "Invalid ERYX message:",
                event.data
            );

            return;

        }


        console.log(
            "ERYX message:",
            message
        );


        // =================================================
        // USER TRANSCRIPT
        // =================================================

        if (
            message.type ===
            "transcript"
        ) {

            transcript.textContent =
                message.text;


            status.textContent =
                "🧠 ERYX is thinking...";

        }


        // =================================================
        // ERYX TRANSCRIPT
        // =================================================

        else if (
            message.type ===
            "answer"
        ) {

            /*
             * Gemini can send the response
             * transcription in multiple chunks.
             *
             * Therefore append instead of replacing.
             */

            if (
                answer.textContent === "-"
            ) {

                answer.textContent = "";

            }


            answer.textContent +=
                message.text;

        }


        // =================================================
        // TURN COMPLETE
        // =================================================

        else if (
            message.type === "turn_complete"
        ) {

            status.textContent =
                "🟢 Ready for next question";

            console.log(
                "ERYX: Ready for next turn"
            );
        }

    };

}


// =====================================================
// START RECORDING
// =====================================================

async function startRecording() {

    try {

        if (
            !socket ||
            socket.readyState !== WebSocket.OPEN
        ) {

            console.log("WebSocket not ready");
            return;
        }

        // Create microphone audio context

        audioContext = new AudioContext({
            sampleRate: 16000
        });

        await audioContext.resume();

        // Microphone

        microphoneStream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

        microphoneSource =
            audioContext.createMediaStreamSource(
                microphoneStream
            );

        // Load processor

        await audioContext.audioWorklet.addModule(
            "/pcm-processor.js"
        );

        pcmProcessor =
            new AudioWorkletNode(
                audioContext,
                "pcm-processor"
            );

        // Receive PCM

        pcmProcessor.port.onmessage =
            function(event) {

                if (
                    !recording ||
                    !socket ||
                    socket.readyState !== WebSocket.OPEN
                ) {
                    return;
                }

                socket.send(event.data);
            };

        microphoneSource.connect(
            pcmProcessor
        );

        // Keep processor alive

        pcmProcessor.connect(
            audioContext.destination
        );

        // IMPORTANT

        recording = true;

        button.textContent =
            "⏹ Stop ERYX";

        status.textContent =
            "🎤 ERYX is listening...";

        transcript.textContent = "-";

        answer.textContent = "";

        console.log(
            "ERYX: New turn started"
        );

    }

    catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        status.textContent =
            "❌ Microphone error";
    }
}

// =====================================================
// STOP RECORDING
// =====================================================

function stopRecording() {

    if (!recording) {
        return;
    }

    console.log(
        "ERYX: Stopping current turn"
    );

    recording = false;

    // Tell Gemini that this audio turn ended

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send("STOP");
    }

    // Stop microphone

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(track => track.stop());

        microphoneStream = null;
    }

    // Disconnect source

    if (microphoneSource) {

        microphoneSource.disconnect();

        microphoneSource = null;
    }

    // Disconnect processor

    if (pcmProcessor) {

        pcmProcessor.disconnect();

        pcmProcessor = null;
    }

    // Close microphone context

    if (audioContext) {

        audioContext.close();

        audioContext = null;
    }

    button.textContent =
        "🎤 Start ERYX";

    status.textContent =
        "⏳ ERYX is processing...";

    console.log(
        "ERYX: Turn ended"
    );
}

// =====================================================
// PLAY ERYX PCM AUDIO
// =====================================================

async function playPCM(
    arrayBuffer
) {

    try {


        // =================================================
        // CREATE PLAYBACK CONTEXT
        // =================================================

        if (!playbackContext) {

            playbackContext =
                new AudioContext({
                    sampleRate: 24000
                });

        }


        await playbackContext.resume();


        // =================================================
        // CONVERT ARRAYBUFFER → INT16
        // =================================================

        const int16 =
            new Int16Array(
                arrayBuffer
            );


        // =================================================
        // INT16 → FLOAT32
        // =================================================

        const float32 =
            new Float32Array(
                int16.length
            );


        for (
            let i = 0;
            i < int16.length;
            i++
        ) {

            float32[i] =
                int16[i] / 32768;

        }


        // =================================================
        // CREATE AUDIO BUFFER
        // =================================================

        const audioBuffer =
            playbackContext
                .createBuffer(
                    1,
                    float32.length,
                    24000
                );


        audioBuffer
            .getChannelData(0)
            .set(float32);


        // =================================================
        // CREATE SOURCE
        // =================================================

        const source =
            playbackContext
                .createBufferSource();


        source.buffer =
            audioBuffer;


        source.connect(
            playbackContext.destination
        );


        // =================================================
        // QUEUE AUDIO
        // =================================================

        const currentTime =
            playbackContext.currentTime;


        if (
            nextPlayTime <
            currentTime
        ) {

            nextPlayTime =
                currentTime;

        }


        source.start(
            nextPlayTime
        );


        nextPlayTime +=
            audioBuffer.duration;


        console.log(
            "Playing ERYX audio"
        );

    }


    catch (error) {

        console.error(
            "Audio playback error:",
            error
        );

    }

}


// =====================================================
// BUTTON
// =====================================================

button.addEventListener(
    "click",
    function () {


        if (!recording) {

            startRecording();

        }

        else {

            stopRecording();

        }

    }
);


// =====================================================
// INITIAL CONNECTION
// =====================================================

button.disabled = true;


connectWebSocket();


</script>


</body>

</html>
